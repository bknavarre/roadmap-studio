<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadmap Studio Link Directory</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7f9;
  color: #1e293b;
  margin: 0;
  padding: 28px;
}

main {
  max-width: 1100px;
  margin: auto;
}

h1 {
  margin-bottom: 6px;
}

p {
  color: #64748b;
}

section {
  background: white;
  border: 1px solid #dce3e8;
  border-radius: 10px;
  padding: 18px;
  margin: 18px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  text-align: left;
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
}

th {
  background: #f8fafc;
}

a {
  color: #0369a1;
  font-weight: 600;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.edit-link {
  color: #7c3d12;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 6px;
  padding: 5px 8px;
  display: inline-block;
}

@media (max-width: 650px) {
  body {
    padding: 12px;
  }

  th,
  td {
    padding: 8px;
    font-size: 14px;
  }
}
</style>
</head>

<body>
<main>

<h1>Roadmap Studio Link Directory</h1>

<p>
Published view-only links for roadmap pages, plus director-edit links for NNL.
Swimlanes open in FY mode; viewers can switch modes inside the view.
</p>

<div id="directory"></div>

</main>

<script>
const base = "https://bknavarre.github.io/roadmap-studio/";

const pillars = [
  "ARDC",
  "B&CS",
  "BI",
  "CS",
  "FMS",
  "HCM",
  "IAS & SI",
  "ISO",
  "OTIS",
  "PMO",
  "SWIS",
  "SYSOPS"
];

const campuses = [
  "SFA",
  "TACC",
  "UTA",
  "UTAUS",
  "UTD",
  "UTEP",
  "UTHCT",
  "UTHSCH",
  "UTHSCSA",
  "UTMBG",
  "UTMDACCH",
  "UTPB",
  "UTRGV",
  "UTS",
  "UTSA",
  "UTSHARE",
  "UTSWMCD",
  "UTT"
];

const functionalCommittees = [
  "ABSENCE MANAGEMENT",
  "ACCOUNTS PAYABLE / TRAVEL & EXPENSE",
  "ACCOUNTS RECEIVABLE / BILLING",
  "BENEFITS",
  "BUSINESS INTELLIGENCE",
  "COMMITMENT ACCOUNTING",
  "COMMITMENT CONTROL",
  "GENERAL LEDGER",
  "GRANTS MANAGEMENT",
  "HUMAN RESOURCES",
  "INFORMATION SECURITY (CISO)",
  "INTELLIGENT AUTOMATION SERVICES (IAS)",
  "PAYROLL",
  "PORTAL AND SECURITY",
  "PURCHASING / EPRO",
  "RECRUITING",
  "SERVICENOW",
  "SHARED INFORMATION SERVICES (SIS)",
  "STUDENT SYSTEMS",
  "SYSTEM OPERATIONS - SIS",
  "SYSTEMWIDE INFORMATION SERVICES (SWIS)",
  "TECH AND INFO SERVICES (OTIS)",
  "TIME AND LABOR",
  "TREASURY"
];

function makeUrl(view, name, display, extra = {}) {
  const url = new URL(base);

  url.searchParams.set("view", view);
  url.searchParams.set("name", name);
  url.searchParams.set("display", display);
  url.searchParams.set("published", "1");

  Object.entries(extra).forEach(([key, value]) => {
    url.searchParams.set(key, value);
  });

  return url.toString();
}

function link(text, url, className = "") {
  return `
    <a
      href="${url}"
      target="_blank"
      rel="noopener noreferrer"
      ${className ? `class="${className}"` : ""}
    >
      ${text}
    </a>
  `;
}

function standardSection(title, firstColumn, view, names) {
  const rows = names.map(name => `
    <tr>
      <td>${escapeHtml(name)}</td>

      <td>
        ${link(
          "Open Roadmap",
          makeUrl(view, name, "timeline")
        )}
      </td>

      <td>
        ${link(
          "Open Swimlane",
          makeUrl(view, name, "swimlane", { mode: "FY" })
        )}
      </td>
    </tr>
  `).join("");

  return `
    <section>
      <h2>${title}</h2>

      <table>
        <thead>
          <tr>
            <th>${firstColumn}</th>
            <th>Roadmap</th>
            <th>Swimlane</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>
      </table>
    </section>
  `;
}

function nnlSection() {
  const rows = pillars.map(name => `
    <tr>
      <td>${escapeHtml(name)}</td>

      <td>
        ${link(
          "Open NNL",
          makeUrl("pillar", name, "nnl")
        )}
      </td>

      <td>
        ${link(
          "Open Editor",
          makeUrl(
            "pillar",
            name,
            "nnl",
            { edit: "1" }
          ),
          "edit-link"
        )}
      </td>
    </tr>
  `).join("");

  return `
    <section>
      <h2>NNL Pages</h2>

      <table>
        <thead>
          <tr>
            <th>Pillar</th>
            <th>View</th>
            <th>Director Edit</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>
      </table>
    </section>
  `;
}

function escapeHtml(value) {
  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

document.getElementById("directory").innerHTML =
  standardSection(
    "Pillar Pages",
    "Pillar",
    "pillar",
    pillars
  ) +

  standardSection(
    "Campus Pages",
    "Campus",
    "campus",
    campuses
  ) +

  standardSection(
    "FC Pages",
    "Functional Committee",
    "fc",
    functionalCommittees
  ) +

  nnlSection();
</script>

</body>
</html>
