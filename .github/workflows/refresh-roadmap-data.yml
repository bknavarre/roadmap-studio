name: Refresh Roadmap Data
run-name: Process complete ServiceNow source batch

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sis-roadmap-refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify four source workbooks are present
        run: |
          test -f "roadmap_sources/PMO Daily Roadmunk - Projects.xlsx"
          test -f "roadmap_sources/PMO Daily Roadmunk - Demands.xlsx"
          test -f "roadmap_sources/PMO Daily Roadmunk - Enhancements.xlsx"
          test -f "roadmap_sources/PMO Daily Roadmunk - Ideas.xlsx"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: roadmap_pipeline/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r roadmap_pipeline/requirements.txt

      - name: Transform ServiceNow source files
        run: |
          mkdir -p build
          python roadmap_pipeline/roadmap_transform.py \
            --input-dir roadmap_sources \
            --output build/roadmap_data.json \
            --status build/roadmap_status.json

      - name: Calculate New Updated Deleted
        run: |
          python roadmap_pipeline/roadmap_change_summary.py \
            public/roadmap_data.json \
            build/roadmap_data.json \
            build/roadmap_status.json

      - name: Validate and promote roadmap outputs
        run: |
          python - <<'PY'
          import json, shutil, sys
          from pathlib import Path

          data = Path('build/roadmap_data.json')
          status = Path('build/roadmap_status.json')
          if not data.is_file() or not status.is_file():
              print('::error::Transformer did not produce both required JSON files.')
              sys.exit(1)

          json.loads(data.read_text(encoding='utf-8'))
          meta = json.loads(status.read_text(encoding='utf-8'))
          source_count = int(meta.get('sourceRecords', 0))
          line_count = int(meta.get('roadmapLines', 0))
          changes = meta.get('changes', {})
          print(f'Validated source records: {source_count}')
          print(f'Validated roadmap lines: {line_count}')
          print(f"New={changes.get('new',0)} Updated={changes.get('updated',0)} Deleted={changes.get('deleted',0)}")

          if source_count < 350:
              print(f'::error::Refusing publish: source record count {source_count} is below 350.')
              sys.exit(1)
          if line_count < 450:
              print(f'::error::Refusing publish: roadmap line count {line_count} is below 450.')
              sys.exit(1)

          Path('public').mkdir(exist_ok=True)
          shutil.copy2(data, 'public/roadmap_data.json')
          shutil.copy2(status, 'public/roadmap_status.json')
          PY

      - name: Generate Roadmap Link Directory
        run: |
          python roadmap_pipeline/generate_roadmap_links.py

      - name: Commit processed roadmap outputs
        run: |
          git add public/roadmap_data.json public/roadmap_status.json public/roadmap_links.html public/roadmap_links.csv
          if ! git diff --cached --quiet; then
            git config user.name 'SIS Roadmap Automation'
            git config user.email 'roadmap-automation@users.noreply.github.com'
            git commit -m 'Automated roadmap data refresh'
            git push origin HEAD:main
          else
            echo 'No roadmap output differences to commit; continuing to build/deploy this successful run.'
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build Roadmap Studio
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Roadmap Studio to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Power Automate of successful refresh
        env:
          POWER_AUTOMATE_ROADMAP_WEBHOOK: ${{ secrets.POWER_AUTOMATE_ROADMAP_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open('public/roadmap_status.json', encoding='utf-8') as f:
              status = json.load(f)

          changes = status.get('changes', {})

          payload = {
              'created_count': int(changes.get('new', 0)),
              'updated_count': int(changes.get('updated', 0)),
              'deleted_count': int(changes.get('deleted', 0)),
              'error_count': 0,
              'rejections_list': ''
          }

          print(
              f"Sending to Power Automate: "
              f"New={payload['created_count']} "
              f"Updated={payload['updated_count']} "
              f"Deleted={payload['deleted_count']}"
          )

          request = urllib.request.Request(
              os.environ['POWER_AUTOMATE_ROADMAP_WEBHOOK'],
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST'
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Power Automate notification sent successfully: HTTP {response.status}")
          PY
